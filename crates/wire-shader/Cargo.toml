[package]
name = "wire-shader"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"
publish = false
description = "Bounded portable shader compilation using dxbc-spirv and Naga"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naga = { version = "=29.0.4", features = ["spv-in", "wgsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
